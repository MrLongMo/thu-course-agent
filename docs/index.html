<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東海大學選課助手</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
      background: #f5f6fa;
      color: #222;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a56db;
      color: #fff;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
    header p  { font-size: .78rem; opacity: .8; margin-top: 2px; }

    /* ── Tab 切換 ── */
    .tab-bar {
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      padding: 7px 16px;
      border: none;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,.15);
      color: #fff;
      transition: background .15s;
    }
    .tab-btn.active { background: #fff; color: #1a56db; }

    /* ── Credits badge ── */
    .credits-badge {
      background: #fbbf24;
      color: #1a1a1a;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: .82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 62px;
      z-index: 90;
    }
    .controls input,
    .controls select {
      flex: 1 1 200px;
      padding: 9px 13px;
      border: 1.5px solid #d0d7e3;
      border-radius: 8px;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .controls input:focus,
    .controls select:focus { border-color: #1a56db; }

    /* ── Stats bar ── */
    .stats {
      padding: 8px 16px;
      font-size: .8rem;
      color: #666;
      background: #f5f6fa;
    }

    /* ── Course Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
      padding: 12px 16px 24px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: box-shadow .2s, transform .15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(26,86,219,.13); transform: translateY(-2px); }
    .card.selected { border: 2px solid #1a56db; }

    .card-title {
      font-size: .97rem;
      font-weight: 700;
      color: #1a56db;
      line-height: 1.35;
    }
    .card-dept {
      font-size: .76rem;
      color: #888;
      margin-top: -4px;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #eef2ff;
      color: #3b5bdb;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: .75rem;
      font-weight: 500;
    }
    .tag.warn  { background: #fff3e0; color: #e65100; }
    .tag.full  { background: #fce4ec; color: #c62828; }
    .tag.ok    { background: #e8f5e9; color: #2e7d32; }

    /* 選課人數 bar */
    .enroll-bar {
      height: 5px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .enroll-fill {
      height: 100%;
      border-radius: 4px;
      transition: width .4s;
    }

    /* ── Detail Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 24px 20px 32px;
      width: 100%;
      max-width: 560px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: #1a56db; }
    .modal-dept  { font-size: .8rem; color: #888; margin-top: 3px; }
    .modal-section { margin-top: 16px; }
    .modal-section h3 { font-size: .82rem; color: #999; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .modal-section p  { font-size: .88rem; line-height: 1.65; color: #444; }
    .grade-table { width: 100%; border-collapse: collapse; font-size: .84rem; margin-top: 6px; }
    .grade-table th { background: #f0f4ff; color: #1a56db; padding: 6px 10px; text-align: left; font-weight: 600; }
    .grade-table td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; }
    .close-btn {
      position: absolute;
      top: 14px; right: 16px;
      background: #f0f0f0;
      border: none; border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-wrap { position: relative; }

    /* ── Add to Schedule Button ── */
    .add-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .add-btn:hover { background: #1648c0; }
    .add-btn.remove { background: #ef4444; }
    .add-btn.remove:hover { background: #dc2626; }
    .add-btn:disabled { background: #ccc; cursor: default; }
    .add-btn.syllabus-btn {
      background: #fff;
      color: #1a56db;
      border: 2px solid #1a56db;
      margin-top: 10px;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .add-btn.syllabus-btn:hover { background: #eff6ff; }

    /* ── AI 分析區塊 ── */
    .ai-section {
      margin-top: 16px;
      border: 1.5px dashed #c7d2fe;
      border-radius: 10px;
      padding: 14px 16px;
      background: #f5f7ff;
    }
    .ai-section h3 {
      font-size: .82rem;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-placeholder {
      font-size: .85rem;
      color: #888;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .ai-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .ai-btn:hover:not(:disabled) { background: #4f46e5; }
    .ai-btn:disabled { opacity: .55; cursor: not-allowed; }

    /* AI 結果 */
    .ai-result { margin-top: 10px; font-size: .85rem; line-height: 1.7; color: #444; }
    .ai-result .ai-label { font-weight: 700; color: #6366f1; }
    .ai-loading { font-size: .85rem; color: #6366f1; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    .ai-error { font-size: .84rem; color: #ef4444; margin-top: 8px; }

    /* ── AI 來源區塊 ── */
    .ai-sources {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e0e7ff;
    }
    .ai-sources h4 {
      font-size: .75rem;
      color: #6366f1;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .ai-sources ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ai-sources li a {
      font-size: .78rem;
      color: #3b5bdb;
      text-decoration: none;
      word-break: break-all;
      line-height: 1.4;
    }
    .ai-sources li a:hover { text-decoration: underline; }
    .ai-sources .no-source { font-size: .78rem; color: #aaa; }

    /* ── 比較所有老師 ── */
    .compare-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: #fff;
      color: #6366f1;
      border: 1.5px solid #6366f1;
      border-radius: 8px;
      font-size: .83rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background .15s;
    }
    .compare-btn:hover { background: #eef2ff; }
    .compare-section {
      margin-top: 16px;
      border-top: 1px solid #e0e7ff;
      padding-top: 14px;
    }
    .compare-section h3 {
      font-size: .82rem;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 12px;
    }
    .compare-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .compare-card {
      flex: 0 0 220px;
      background: #f5f7ff;
      border: 1.5px dashed #c7d2fe;
      border-radius: 10px;
      padding: 14px;
      font-size: .83rem;
    }
    .compare-card .cc-teacher {
      font-weight: 700;
      color: #1a56db;
      margin-bottom: 10px;
      font-size: .9rem;
    }
    .compare-card .cc-course-id {
      font-size: .72rem;
      color: #aaa;
      margin-bottom: 8px;
    }
    .compare-card .ai-label { font-weight: 700; color: #6366f1; }
    .compare-card .cc-row { margin-top: 6px; line-height: 1.6; color: #444; }

    /* ── Loading / Empty ── */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      font-size: .9rem;
      grid-column: 1/-1;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px 32px;
    }
    .pagination button {
      padding: 7px 14px;
      border: 1.5px solid #d0d7e3;
      border-radius: 8px;
      background: #fff;
      font-size: .85rem;
      cursor: pointer;
      transition: background .15s;
    }
    .pagination button:hover:not(:disabled) { background: #eef2ff; border-color: #1a56db; color: #1a56db; }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination .page-info { align-self: center; font-size: .83rem; color: #666; }

    /* ══════════════════════════════════
       週課表 (Schedule View)
    ══════════════════════════════════ */
    #scheduleView {
      display: none;
      padding: 16px;
      overflow-x: auto;
    }

    /* 已選課程列表 */
    .selected-list {
      margin-bottom: 16px;
    }
    .selected-list h2 {
      font-size: .9rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 8px;
    }
    .selected-list .empty-hint {
      font-size: .83rem;
      color: #aaa;
      padding: 12px 0;
    }
    .selected-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fff;
      border-radius: 8px;
      margin-bottom: 6px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      gap: 8px;
    }
    .selected-item .si-name { font-size: .88rem; font-weight: 600; flex: 1; }
    .selected-item .si-info { font-size: .76rem; color: #888; }
    .selected-item .si-remove {
      background: none;
      border: 1px solid #fca5a5;
      color: #ef4444;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: .75rem;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .selected-item .si-remove:hover { background: #fef2f2; }

    /* 課表格子 */
    .timetable-wrap {
      overflow-x: auto;
    }
    .timetable {
      border-collapse: collapse;
      width: 100%;
      min-width: 540px;
      font-size: .78rem;
    }
    .timetable th {
      background: #1a56db;
      color: #fff;
      padding: 8px 4px;
      text-align: center;
      font-weight: 600;
      min-width: 90px;
    }
    .timetable th.period-col {
      background: #374151;
      min-width: 80px;
      font-size: .72rem;
    }
    .timetable td {
      border: 1px solid #e5e7eb;
      height: 44px;
      vertical-align: middle;
      text-align: center;
      background: #fff;
      padding: 2px;
    }
    .timetable td.period-label {
      background: #f9fafb;
      color: #6b7280;
      font-size: .7rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .period-time {
      display: block;
      font-size: .6rem;
      color: #9ca3af;
      font-weight: 400;
      margin-top: 1px;
    }
    /* B節（午休）列淡底色 */
    .timetable tr.period-B td {
      background: #f3f4f6;
    }
    .timetable tr.period-B td.period-label {
      background: #e9eaec;
    }
    /* 有課的格子 */
    .timetable td.has-course {
      background: #dbeafe;
      color: #1e40af;
      font-weight: 600;
      font-size: .72rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1.2;
    }
    .timetable td.has-course:hover { background: #bfdbfe; }
    /* 衝堂格子 */
    .timetable td.conflict {
      background: #fee2e2;
      color: #991b1b;
    }
    .timetable td.conflict:hover { background: #fecaca; }

    /* 節次時間對應表 */
    .period-times {
      font-size: .7rem;
      color: #9ca3af;
      margin-top: 10px;
      padding: 8px 12px;
      background: #f9fafb;
      border-radius: 8px;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .modal { max-height: 90vh; }
      .timetable { font-size: .68rem; }
      .timetable th { min-width: 60px; }
    }
  </style>
</head>

<script>
  // ════════════════════════════════
  //  State
  // ════════════════════════════════
  let state = { q: '', dept: '', page: 1, total: 0 };
  const PER_PAGE = 30;

  // 已選課程 map: courseId → { course, slots }
  // slots: [{day:1-5, periods:[...], room:''}]
  const selectedCourses = {};

  // 目前 modal 開著的課程物件
  let modalCourse = null;

  // ── DOM refs ──
  const grid       = document.getElementById('courseGrid');
  const statsBar   = document.getElementById('statsBar');
  const pagination = document.getElementById('pagination');
  const overlay    = document.getElementById('overlay');

  // ── Debounce ──
  let debTimer;
  function debounce(fn, ms=320) {
    clearTimeout(debTimer);
    debTimer = setTimeout(fn, ms);
  }

  // ════════════════════════════════
  //  Tab 切換
  // ════════════════════════════════
  function switchTab(tab) {
    document.getElementById('listView').style.display   = tab === 'list'     ? '' : 'none';
    document.getElementById('scheduleView').style.display = tab === 'schedule' ? 'block' : 'none';
    document.getElementById('tabList').classList.toggle('active',  tab === 'list');
    document.getElementById('tabSched').classList.toggle('active', tab === 'schedule');
    if (tab === 'schedule') renderSchedule();
  }

  // ════════════════════════════════
  //  課程列表
  // ════════════════════════════════
  async function fetchCourses() {
    const params = new URLSearchParams({
      q: state.q, dept: state.dept, page: state.page, per_page: PER_PAGE
    });
    const res  = await fetch(`/api/courses?${params}`);
    const data = await res.json();
    state.total = data.total;
    renderCourses(data.courses);
    renderStats(data.total, data.page, data.per_page);
    renderPagination(data.total, data.page);
  }

  function renderCourses(courses) {
    if (!courses.length) {
      grid.innerHTML = '<p class="state-msg">找不到符合條件的課程</p>';
      return;
    }
    grid.innerHTML = courses.map(c => cardHTML(c)).join('');
    grid.querySelectorAll('.card').forEach((el, i) => {
      el.addEventListener('click', () => openModal(courses[i]));
    });
  }

  function cardHTML(c) {
    const enrolled = c['選課人數'] ?? 0;
    const limit    = c['上限人數']  ?? 0;
    const ratio    = limit > 0 ? enrolled / limit : 0;
    const pct      = Math.min(100, Math.round(ratio * 100));
    const fillColor = ratio >= 1 ? '#ef4444' : ratio >= .8 ? '#f97316' : '#22c55e';
    const enrollTag = ratio >= 1
      ? `<span class="tag full">爆滿 ${enrolled}/${limit}</span>`
      : ratio >= .8
        ? `<span class="tag warn">${enrolled}/${limit}</span>`
        : `<span class="tag ok">${enrolled}/${limit}</span>`;
    const isSelected = !!selectedCourses[c['選課代碼']];

    return `
      <div class="card${isSelected ? ' selected' : ''}">
        <div class="card-title">${escHtml(c['課程名稱'] || '—')}</div>
        <div class="card-dept">${escHtml(c['開課系所名稱'] || '')}</div>
        <div class="card-meta">
          <span class="tag">📚 ${c['學分'] ?? '—'} 學分</span>
          ${enrollTag}
          ${c['必選修'] ? typeTag(c['必選修']) : ''}
          ${isSelected ? '<span class="tag" style="background:#dcfce7;color:#166534">✓ 已選</span>' : ''}
        </div>
        ${limit > 0 ? `
        <div class="enroll-bar">
          <div class="enroll-fill" style="width:${pct}%;background:${fillColor}"></div>
        </div>` : ''}
      </div>`;
  }

  function typeTag(val) {
    const map = {1:'必修', 2:'選修', 3:'選修'};
    const label = map[val] || val;
    return `<span class="tag" style="background:#f3f4f6;color:#555">${label}</span>`;
  }

  function renderStats(total, page, per_page) {
    const start = (page-1)*per_page + 1;
    const end   = Math.min(page*per_page, total);
    statsBar.textContent = total > 0
      ? `共 ${total} 門課程，顯示第 ${start}–${end} 筆`
      : '找不到課程';
  }

  function renderPagination(total, page) {
    const totalPages = Math.ceil(total / PER_PAGE);
    if (totalPages <= 1) { pagination.innerHTML = ''; return; }
    pagination.innerHTML = `
      <button onclick="goPage(${page-1})" ${page<=1?'disabled':''}>← 上一頁</button>
      <span class="page-info">第 ${page} / ${totalPages} 頁</span>
      <button onclick="goPage(${page+1})" ${page>=totalPages?'disabled':''}>下一頁 →</button>`;
  }

  function goPage(p) {
    state.page = p;
    fetchCourses();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  // ════════════════════════════════
  //  Modal
  // ════════════════════════════════
  async function openModal(c) {
    modalCourse = c;
    const enrolled = c['選課人數'] ?? 0;
    const limit    = c['上限人數']  ?? 0;
    const grades   = c['評分方式'];
    const overview = c['課程概述'];
    const isSelected = !!selectedCourses[c['選課代碼']];

    let gradesHTML = '';
    if (grades && grades.length) {
      const rows = grades.map(g =>
        `<tr><td>${escHtml(g['評分項目'])}</td><td>${g['配分比例']}%</td><td>${escHtml(g['說明']||'')}</td></tr>`
      ).join('');
      gradesHTML = `
        <div class="modal-section">
          <h3>評分方式</h3>
          <table class="grade-table">
            <thead><tr><th>項目</th><th>比例</th><th>說明</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    const btnId = 'modalAddBtn';
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-title">${escHtml(c['課程名稱']||'')}</div>
      <div class="modal-dept">${escHtml(c['開課系所名稱']||'')} · 選課代碼 ${c['選課代碼']||'—'}</div>
      <div class="card-meta" style="margin-top:12px;flex-wrap:wrap;display:flex;gap:6px">
        <span class="tag">📚 ${c['學分']??'—'} 學分</span>
        <span class="tag">👥 ${enrolled} / ${limit} 人</span>
        ${c['必選修'] ? typeTag(c['必選修']) : ''}
      </div>
      <div class="modal-section" style="margin-top:12px">
        <table style="font-size:.87rem;color:#444;border-collapse:collapse;width:100%">
          <tr>
            <td style="width:80px;color:#999;padding:3px 0">授課教師</td>
            <td style="padding:3px 0;font-weight:500">${escHtml(c['授課教師']||'—')}</td>
          </tr>
          <tr>
            <td style="color:#999;padding:3px 0">上課時間</td>
            <td style="padding:3px 0">${escHtml(c['上課時間']||'—')}</td>
          </tr>
          <tr>
            <td style="color:#999;padding:3px 0">教室</td>
            <td style="padding:3px 0">${escHtml(c['教室']||'—')}</td>
          </tr>
        </table>
      </div>
      ${overview ? `
      <div class="modal-section">
        <h3>課程概述</h3>
        <p>${escHtml(overview)}</p>
      </div>` : ''}
      ${gradesHTML}
      <div class="ai-section" id="aiSection">
        <h3>🤖 AI 分析</h3>
        <p class="ai-placeholder" id="aiPlaceholder">搜尋 Dcard 評價，分析難易度與上課風格（需 5-10 秒）</p>
        <div id="aiResult"></div>
        <button class="ai-btn" id="aiBtn" onclick="triggerAI('${c['選課代碼']}')">✨ 取得 AI 分析</button>
        <div id="compareTeachersBtnWrap"></div>
      </div>
      <div class="compare-section" id="compareSection" style="display:none">
        <h3>👨‍🏫 比較所有老師</h3>
        <div class="compare-grid" id="compareGrid"></div>
      </div>
      <a class="add-btn syllabus-btn"
        href="https://course.thu.edu.tw/view/114/2/${c['選課代碼']}"
        target="_blank" rel="noopener noreferrer">
        📄 課程綱要
      </a>
      <button class="add-btn${isSelected ? ' remove' : ''}" id="${btnId}"
        onclick="toggleCourse()">
        ${isSelected ? '移除課程' : '加入課表'}
      </button>
    `;
    overlay.classList.add('open');
    // 非同步查同名課程，決定是否顯示「比較所有老師」按鈕
    checkSiblings(c['選課代碼']);
  }

  function closeModal(e) {
    if (e.target === overlay) overlay.classList.remove('open');
  }
  function closeModalDirect() { overlay.classList.remove('open'); }

  // ════════════════════════════════
  //  加入 / 移除 課表
  // ════════════════════════════════
  async function toggleCourse() {
    if (!modalCourse) return;
    const cid = modalCourse['選課代碼'];

    if (selectedCourses[cid]) {
      // 移除
      delete selectedCourses[cid];
      updateCredits();
      refreshModalBtn();
      fetchCourses(); // 更新 card 狀態
      return;
    }

    // 加入：先抓時間
    const btn = document.getElementById('modalAddBtn');
    btn.disabled = true;
    btn.textContent = '抓取時間中…';

    try {
      const res = await fetch(`/api/course_time/${cid}`);
      const data = await res.json();
      const slots = data.slots || [];

      // 衝堂檢查
      const conflicts = checkConflict(slots, cid);
      if (conflicts.length > 0) {
        const names = conflicts.map(id => selectedCourses[id]?.course['課程名稱'] || id).join('、');
        if (!confirm(`與「${names}」時間衝突，仍要加入嗎？`)) {
          btn.disabled = false;
          btn.textContent = '加入課表';
          return;
        }
      }

      selectedCourses[cid] = { course: modalCourse, slots };
      updateCredits();
      refreshModalBtn();
      fetchCourses();
    } catch(e) {
      btn.disabled = false;
      btn.textContent = '加入課表';
      alert('無法抓取時間資料，請稍後再試');
    }
  }

  function checkConflict(newSlots, skipId) {
    const conflictIds = new Set();
    for (const [cid, entry] of Object.entries(selectedCourses)) {
      if (cid === skipId) continue;
      for (const ns of newSlots) {
        for (const es of entry.slots) {
          if (ns.day === es.day && ns.periods.some(p => es.periods.includes(p))) {
            conflictIds.add(cid);
          }
        }
      }
    }
    return [...conflictIds];
  }

  function refreshModalBtn() {
    if (!modalCourse) return;
    const cid = modalCourse['選課代碼'];
    const isSelected = !!selectedCourses[cid];
    const btn = document.getElementById('modalAddBtn');
    if (!btn) return;
    btn.disabled = false;
    btn.textContent = isSelected ? '移除課程' : '加入課表';
    btn.className = 'add-btn' + (isSelected ? ' remove' : '');
  }

  function updateCredits() {
    let total = 0;
    for (const entry of Object.values(selectedCourses)) {
      total += entry.course['學分'] ?? 0;
    }
    document.getElementById('creditsBadge').textContent = `已選 ${total} 學分`;
  }

  // ════════════════════════════════
  //  週課表 Render
  // ════════════════════════════════
  const PERIODS = [1, 2, 3, 4, 'B', 5, 6, 7, 8, 9, 10, 11, 12, 13];
  const PERIOD_TIMES = {
    1:'08:10~09:00', 2:'09:10~10:00', 3:'10:20~11:10', 4:'11:20~12:10',
    'B':'12:10~13:00', 5:'13:10~14:00', 6:'14:10~15:00', 7:'15:20~16:10',
    8:'16:20~17:10', 9:'17:20~18:10', 10:'18:20~19:10', 11:'19:20~20:10',
    12:'20:20~21:10', 13:'21:20~22:10'
  };
  const DAY_NAMES = ['週一','週二','週三','週四','週五'];

  function renderSchedule() {
    renderSelectedList();
    renderTimetable();
  }

  function renderSelectedList() {
    const container = document.getElementById('selectedList');
    const entries = Object.values(selectedCourses);
    if (!entries.length) {
      container.innerHTML = '<p class="empty-hint">尚未加入任何課程</p>';
      return;
    }
    container.innerHTML = entries.map(({ course }) => {
      const cid = course['選課代碼'];
      const timeStr = formatSlots(selectedCourses[cid].slots);
      return `
        <div class="selected-item">
          <div>
            <div class="si-name">${escHtml(course['課程名稱'])}</div>
            <div class="si-info">${escHtml(course['開課系所名稱'])} · ${course['學分']}學分 ${timeStr ? '· ' + timeStr : ''}</div>
          </div>
          <button class="si-remove" onclick="removeCourse('${cid}')">移除</button>
        </div>`;
    }).join('');
  }

  function formatSlots(slots) {
    if (!slots || !slots.length) return '（無時間資料）';
    const dayNames = ['','一','二','三','四','五'];
    return slots.map(s => `${dayNames[s.day]}/${s.periods.join(',')}`).join(' ');
  }

  function renderTimetable() {
    // 建立 grid map: day(1-5) → period(1-13) → [{ cid, name, conflicted }]
    const grid = {};
    for (let d = 1; d <= 5; d++) grid[d] = {};
    for (const p of PERIODS) for (let d = 1; d <= 5; d++) grid[d][p] = [];

    for (const [cid, entry] of Object.entries(selectedCourses)) {
      for (const slot of entry.slots) {
        const d = slot.day;
        if (d < 1 || d > 5) continue;
        for (const p of slot.periods) {
          if (p < 1 || p > 13) continue;
          grid[d][p].push({ cid, name: entry.course['課程名稱'] });
        }
      }
    }

    // 建表格
    const tbody = document.getElementById('timetableBody');
    tbody.innerHTML = PERIODS.map(p => {
      const cells = [1,2,3,4,5].map(d => {
        const items = grid[d][p];
        if (!items.length) return `<td></td>`;
        const isConflict = items.length > 1;
        const cls = isConflict ? 'has-course conflict' : 'has-course';
        const label = items.map(i => escHtml(shortenName(i.name))).join(' / ');
        return `<td class="${cls}" title="${items.map(i=>escHtml(i.name)).join(' / ')}">${label}</td>`;
      }).join('');
      return `<tr class="${p === 'B' ? 'period-B' : ''}">
        <td class="period-label">${p}<span class="period-time">${PERIOD_TIMES[p]||''}</span></td>
        ${cells}
      </tr>`;
    }).join('');
  }

  function shortenName(name) {
    return name.length > 6 ? name.slice(0, 6) + '…' : name;
  }

  function removeCourse(cid) {
    delete selectedCourses[cid];
    updateCredits();
    fetchCourses();
    renderSchedule();
  }

  // ── XSS 防護 ──
  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ════════════════════════════════
  //  AI 分析
  // ════════════════════════════════

  // 渲染參考來源區塊
  function renderSources(sources) {
    if (!sources || !sources.length) {
      return `<div class="ai-sources"><h4>🔗 參考來源</h4><p class="no-source">查無資料</p></div>`;
    }
    const items = sources.map(s =>
      `<li><a href="${escHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escHtml(s.title || s.url)}</a></li>`
    ).join('');
    return `<div class="ai-sources"><h4>🔗 參考來源</h4><ul>${items}</ul></div>`;
  }

  async function triggerAI(courseId) {
    const btn         = document.getElementById('aiBtn');
    const placeholder = document.getElementById('aiPlaceholder');
    const resultDiv   = document.getElementById('aiResult');

    // 設定 loading 狀態
    btn.disabled = true;
    btn.textContent = '分析中…';
    placeholder.style.display = 'none';
    resultDiv.innerHTML = '<div class="ai-loading">⏳ 正在搜尋 Dcard 評價並分析，請稍候…</div>';

    try {
      const res  = await fetch(`/api/analyze/${courseId}`);
      const data = await res.json();

      if (data.no_data) {
        // 搜唔到評價，但仍顯示來源
        resultDiv.innerHTML =
          '<p class="ai-error">暫無 Dcard 評價資料，無法進行分析。</p>' +
          renderSources(data.sources);
        btn.textContent = '重新分析';
        btn.disabled = false;
        return;
      }

      if (data.error) {
        resultDiv.innerHTML = `<p class="ai-error">⚠️ ${escHtml(data.error)}</p>`;
        btn.textContent = '重新分析';
        btn.disabled = false;
        return;
      }

      // 解析 Groq 輸出的三段文字
      const lines = data.analysis.split('\n').filter(l => l.trim());
      let html = `<div class="ai-result">`;
      const sourceNote = data.source_note || `參考 ${data.source_count} 筆 Dcard 貼文`;
      html += `<p style="font-size:.75rem;color:#aaa;margin-bottom:8px">${escHtml(sourceNote)}</p>`;
      for (const line of lines) {
        if (line.startsWith('摘要：')) {
          html += `<p><span class="ai-label">📝 摘要</span><br>${escHtml(line.replace('摘要：', '').trim())}</p>`;
        } else if (line.startsWith('整體傾向：')) {
          const val = line.replace('整體傾向：', '').trim();
          const color = val.includes('正面') ? '#16a34a' : val.includes('負面') ? '#dc2626' : '#b45309';
          html += `<p style="margin-top:8px"><span class="ai-label">💬 整體傾向</span>　<span style="color:${color};font-weight:700">${escHtml(val)}</span></p>`;
        } else if (line.startsWith('難易度：')) {
          html += `<p style="margin-top:8px"><span class="ai-label">⚡ 難易度</span>　${escHtml(line.replace('難易度：', '').trim())}</p>`;
        }
      }
      html += '</div>';
      html += renderSources(data.sources);
      resultDiv.innerHTML = html;

      // 分析完成，改按鈕為「重新分析」
      btn.textContent = '🔄 重新分析';
      btn.disabled = false;

    } catch (err) {
      resultDiv.innerHTML = '<p class="ai-error">⚠️ 網路錯誤，請稍後再試。</p>';
      btn.textContent = '重新分析';
      btn.disabled = false;
    }
  }

  // ════════════════════════════════
  //  比較所有老師
  // ════════════════════════════════

  // openModal 後非同步查同名課程，決定是否顯示比較按鈕
  async function checkSiblings(courseId) {
    try {
      const res  = await fetch(`/api/siblings/${courseId}`);
      const data = await res.json();
      const siblings = data.courses || [];
      if (siblings.length <= 1) return; // 只有一個老師，唔顯示

      const wrap = document.getElementById('compareTeachersBtnWrap');
      if (!wrap) return;
      wrap.innerHTML = `
        <button class="compare-btn" onclick="compareTeachers()">
          👨‍🏫 比較所有老師（${siblings.length} 位）
        </button>`;

      // 把 siblings 存在 closure 供按鈕使用
      wrap._siblings = siblings;
    } catch (e) {
      // 失敗靜默處理，唔影響主流程
    }
  }

  // 點擊「比較所有老師」後觸發
  async function compareTeachers() {
    const wrap    = document.getElementById('compareTeachersBtnWrap');
    const section = document.getElementById('compareSection');
    const gridEl  = document.getElementById('compareGrid');
    if (!wrap || !wrap._siblings) return;

    const siblings = wrap._siblings;
    section.style.display = 'block';

    // 先渲染所有老師的 loading 骨架
    gridEl.innerHTML = siblings.map(s => `
      <div class="compare-card" id="cc-${s['選課代碼']}">
        <div class="cc-teacher">${escHtml(s['授課教師'] || '—')}</div>
        <div class="cc-course-id">選課代碼 ${s['選課代碼']}</div>
        <div class="ai-loading">⏳ 分析中…</div>
      </div>`).join('');

    // 平行 fetch 所有老師分析
    await Promise.all(siblings.map(s => fetchCompareCard(s)));

    // 禁用按鈕避免重複觸發
    const btn = wrap.querySelector('.compare-btn');
    if (btn) { btn.disabled = true; btn.textContent = '✅ 已完成比較'; }
  }

  // 單個老師分析 fetch + 渲染
  async function fetchCompareCard(sibling) {
    const cid  = sibling['選課代碼'];
    const card = document.getElementById(`cc-${cid}`);
    if (!card) return;

    try {
      const res  = await fetch(`/api/analyze/${cid}`);
      const data = await res.json();

      if (data.no_data) {
        card.querySelector('.ai-loading').outerHTML =
          '<p class="ai-error">暫無評價資料</p>';
        return;
      }
      if (data.error) {
        card.querySelector('.ai-loading').outerHTML =
          `<p class="ai-error">⚠️ ${escHtml(data.error)}</p>`;
        return;
      }

      // 解析三行輸出
      const lines = data.analysis.split('\n').filter(l => l.trim());
      let summary = '', tendency = '', difficulty = '';
      for (const line of lines) {
        if (line.startsWith('摘要：'))     summary    = line.replace('摘要：', '').trim();
        if (line.startsWith('整體傾向：')) tendency   = line.replace('整體傾向：', '').trim();
        if (line.startsWith('難易度：'))   difficulty = line.replace('難易度：', '').trim();
      }
      const tendColor = tendency.includes('正面') ? '#16a34a'
                       : tendency.includes('負面') ? '#dc2626' : '#b45309';

      card.querySelector('.ai-loading').outerHTML = `
        <div class="cc-row"><span class="ai-label">📝 摘要</span><br>${escHtml(summary || '資料不足')}</div>
        <div class="cc-row"><span class="ai-label">💬 傾向</span>　<span style="color:${tendColor};font-weight:700">${escHtml(tendency || '資料不足')}</span></div>
        <div class="cc-row"><span class="ai-label">⚡ 難易度</span>　${escHtml(difficulty || '資料不足')}</div>`;
    } catch (e) {
      const loading = card.querySelector('.ai-loading');
      if (loading) loading.outerHTML = '<p class="ai-error">⚠️ 網路錯誤</p>';
    }
  }

  // ── Event listeners ──
  document.getElementById('searchInput').addEventListener('input', e => {
    debounce(() => { state.q = e.target.value.trim(); state.page = 1; fetchCourses(); });
  });
  document.getElementById('deptSelect').addEventListener('change', e => {
    state.dept = e.target.value; state.page = 1; fetchCourses();
  });

  // ── Init ──
  fetchCourses();
  if (window.location.hash === '#schedule') switchTab('schedule');
</script>

  const _orig = window.fetch.bind(window);
  window.fetch = function (resource, opts) {
    const url = typeof resource === 'string' ? resource : (resource.url || '');

    /* /api/courses?q=...&dept=...&page=...&per_page=... */
    if (url.startsWith('/api/courses')) {
      const p        = new URLSearchParams(url.split('?')[1] || '');
      const q        = (p.get('q') || '').toLowerCase().trim();
      const dept     = p.get('dept') || '';
      const page     = Math.max(1, parseInt(p.get('page')     || '1'));
      const per_page = Math.min(100, Math.max(1, parseInt(p.get('per_page') || '30')));

      let res = ALL_COURSES;
      if (dept) res = res.filter(c => c['開課系所名稱'] === dept);
      if (q)    res = res.filter(c =>
        (c['課程名稱']  || '').toLowerCase().includes(q) ||
        (c['授課教師']  || '').toLowerCase().includes(q) ||
        String(c['選課代碼'] || '').includes(q)
      );

      const total    = res.length;
      const start    = (page - 1) * per_page;
      const courses  = res.slice(start, start + per_page);
      const payload  = { total, page, per_page, courses };
      return Promise.resolve({ ok: true, json: () => Promise.resolve(payload) });
    }

    /* /api/analyze/<id> — 顯示靜態 demo 提示 */
    if (/^[/]api[/]analyze[/]/.test(url)) {
      return Promise.resolve({
        ok: true,
        json: () => Promise.resolve({
          no_data: false,
          analysis: '摘要：此為 GitHub Pages 靜態展示版本，AI 搜尋 Dcard 評價功能需要後端伺服器支援。\n整體傾向：中性\n難易度：資料不足',
          source_count: 0,
          source_note: '📌 靜態 Demo 版本 — AI 分析需要後端伺服器（Tavily + Groq）',
          sources: []
        })
      });
    }

    /* /api/course_time/<id> — 回傳空時間（時間表功能需後端） */
    if (/^[/]api[/]course_time[/]/.test(url)) {
      return Promise.resolve({ ok: true, json: () => Promise.resolve({ slots: [] }) });
    }

    /* /api/siblings/<id> — 從本地資料找同名課程 */
    if (/^[/]api[/]siblings[/]/.test(url)) {
      const cid     = url.split('/').pop();
      const course  = ALL_COURSES.find(c => String(c['選課代碼']) === cid);
      const siblings = course
        ? ALL_COURSES
            .filter(c => c['課程名稱'] === course['課程名稱'])
            .map(c => ({ id: String(c['選課代碼']), teacher: c['授課教師'] || '', name: c['課程名稱'] || '' }))
        : [];
      return Promise.resolve({ ok: true, json: () => Promise.resolve(siblings) });
    }

    return _orig(resource, opts);
  };
})();
